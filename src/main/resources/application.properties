spring.application.name=blschool-intranet-backend
server.port=8091
server.servlet.context-path=/blschool-backend/api

# JWT - mismo secret que blschool-intranet-login
security.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-change-me-please-1234567890}

# Clave compartida con el Apps Script del Google Form de preinscripcion (header X-Api-Key).
# Si queda vacia, el endpoint /public/preinscripciones responde 503.
preinscripcion.api-key=${PREINSCRIPCION_API_KEY:}
