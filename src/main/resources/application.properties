spring.application.name=blschool-intranet-backend
server.port=8091
server.servlet.context-path=/blschool-backend/api

# JWT - mismo secret que blschool-intranet-login
security.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-change-me-please-1234567890}

# Clave compartida con el Apps Script del Google Form de preinscripcion (header X-Api-Key).
# Si queda vacia, el endpoint /public/preinscripciones responde 503.
preinscripcion.api-key=${PREINSCRIPCION_API_KEY}

# Devolver el mensaje de ResponseStatusException (validaciones de planillas, 409 de comisiones, etc.)
spring.web.error.include-message=always

# Auditoria con Hibernate Envers: tablas <tabla>_aud + revisiones (usuario y fecha de cada cambio).
# Sólo se registra una revisión cuando cambia algún dato auditado (las columnas aud_* no se auditan).
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
# Al borrar se guardan los últimos valores (p. ej. qué nota tenía una calificación eliminada)
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
# Agregar/quitar un teléfono o un aporte se registra sólo en su propia tabla, sin revisión "vacía" del padre
spring.jpa.properties.org.hibernate.envers.revision_on_collection_change=false
